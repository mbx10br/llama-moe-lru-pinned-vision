<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc">
  <title id="title">Protected startup prefixes survive process restart</title>
  <desc id="desc">The real client prepares stable instructions and tools before any user message. Separate Web and Telegram bases remain on SSD. Same-process sleep can preserve conversations in RAM; process restart restores compatible startup bases from SSD after model loading. Each model owns separate states.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#8298b0"/></marker></defs>
  <rect width="1120" height="530" rx="24" fill="#0d1729"/>
  <g font-family="DejaVu Sans,Arial,sans-serif">
    <text x="36" y="49" fill="#ffffff" font-size="25" font-weight="bold">KEEP THE PREFIX. GIVE THE GPU BACK.</text>
    <text x="36" y="81" fill="#a4b8d0" font-size="18">Stable agent instructions survive beyond the active model process.</text>
    <rect x="36" y="121" width="300" height="112" rx="16" fill="#14243a" stroke="#c4a4ff" stroke-width="1.5"/>
    <text x="54" y="150" fill="#c4a4ff" font-size="19" font-weight="bold">REAL CLIENT PIPELINE</text>
    <text x="54" y="179" fill="#dce8f7" font-size="16">Instructions + tools + bootstrap</text>
    <text x="54" y="207" fill="#a4b8d0" font-size="15">Stop before the first user message</text>
    <rect x="410" y="121" width="300" height="112" rx="16" fill="#14243a" stroke="#65ded1" stroke-width="1.5"/>
    <text x="428" y="150" fill="#65ded1" font-size="19" font-weight="bold">PROTECTED SSD BASES</text>
    <text x="428" y="179" fill="#dce8f7" font-size="16">Web base + Telegram base</text>
    <text x="428" y="207" fill="#a4b8d0" font-size="15">Exact tokens + integrity + identity</text>
    <path d="M342 177 H402" stroke="#8298b0" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
    <rect x="784" y="121" width="300" height="112" rx="16" fill="#14243a" stroke="#ffd17c" stroke-width="1.5"/>
    <text x="802" y="150" fill="#ffd17c" font-size="19" font-weight="bold">NEXT REQUEST</text>
    <text x="802" y="179" fill="#dce8f7" font-size="16">Select best compatible state</text>
    <text x="802" y="207" fill="#a4b8d0" font-size="15">Process the uncached suffix</text>
    <path d="M716 177 H776" stroke="#8298b0" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
    <rect x="36" y="303" width="505" height="113" rx="16" fill="#14243a" stroke="#65ded1" stroke-width="1.5"/>
    <text x="56" y="334" fill="#65ded1" font-size="20" font-weight="bold">SLEEP / WAKE</text>
    <text x="56" y="365" fill="#dce8f7" font-size="17">Release VRAM; retain a bounded RAM cache.</text>
    <text x="56" y="394" fill="#a4b8d0" font-size="16">Reload weights + reuse a matching conversation.</text>
    <rect x="579" y="303" width="505" height="113" rx="16" fill="#14243a" stroke="#ffd17c" stroke-width="1.5"/>
    <text x="599" y="334" fill="#ffd17c" font-size="20" font-weight="bold">PROCESS RESTART</text>
    <text x="599" y="365" fill="#dce8f7" font-size="17">RAM cache is gone; protected SSD bases remain.</text>
    <text x="599" y="394" fill="#a4b8d0" font-size="16">Load weights + restore a verified startup base.</text>
    <path d="M560 239 V266 H288 V295 M560 266 H831 V295" stroke="#8298b0" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
    <text x="36" y="465" fill="#c4d3e5" font-size="16">Each engine keeps its own states. Similarity selects a rebuild target; only exact compatibility permits reuse.</text>
    <text x="36" y="494" fill="#94a9c2" font-size="15">Warm first-token time and cold model loading are different costs. New content still needs computation.</text>
  </g>
</svg>
